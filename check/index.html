<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shield Check: stalkerware su Android</title>
<meta name="description" content="Controllo gratuito nel browser: collega un telefono Android via USB e verifica se contiene stalkerware o spyware conosciuto. Solo lettura, nessun dato lascia il computer.">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,900&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Look and console taken from i-repair.it/irepair-shield/ (pagine/irepair-shield.html, «CONSOLE v2») */
:root{--bg:#0a0a0a;--card:#141414;--card2:#1a1a1a;--cyan:#00c2ff;--gold:#fbbf24;--green:#22c55e;--ok:#16b87f;--red:#ff5c5c;--text:#fff;--text2:#d4d4d8;--text3:#a1a1aa;--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--text);font:16px/1.6 'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(1100px 560px at 78% -8%,rgba(0,194,255,.13),transparent 68%),radial-gradient(700px 420px at -10% 40%,rgba(22,184,127,.06),transparent 70%),var(--bg);overflow-x:hidden}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font:700 17px 'Bricolage Grotesque',sans-serif;letter-spacing:-.3px}
.brand small{display:block;font:400 9px 'Space Mono',monospace;letter-spacing:2px;color:var(--text3);text-transform:uppercase}
.brand b{color:var(--cyan)}
.lang{display:flex;gap:6px}
.lang button{font:700 11px 'Space Mono',monospace;letter-spacing:.08em;background:transparent;border:1px solid var(--border2);color:var(--text3);padding:7px 12px;border-radius:100px;cursor:pointer}
.lang button[aria-pressed=true]{background:rgba(0,194,255,.1);border-color:rgba(0,194,255,.4);color:var(--cyan)}
/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding:40px 0 30px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border2);border-radius:100px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--text2)}
.pill.cyan{background:rgba(0,194,255,.08);border-color:rgba(0,194,255,.22);color:var(--cyan)}
.pill.green{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.24);color:var(--green)}
.pulse{position:relative;width:7px;height:7px;border-radius:50%;background:currentColor}
.pulse::after{content:'';position:absolute;inset:0;border-radius:50%;background:currentColor;animation:dotpulse 2.4s infinite}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:900;font-size:clamp(40px,5vw,66px);line-height:1.02;letter-spacing:-2.5px;margin:0 0 20px;text-wrap:balance}
h1 .eyebrow{display:block;font:700 13px 'Inter',sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--cyan);margin-bottom:14px}
h1 .w1{display:block}
h1 .w2{display:block;color:var(--cyan);text-shadow:0 0 48px rgba(0,194,255,.45)}
.lead{font:600 21px/1.32 'Bricolage Grotesque',sans-serif;letter-spacing:-.4px;color:rgba(255,255,255,.88);margin:0 0 14px;max-width:520px}
.sub{color:var(--text3);font-size:15px;margin:0 0 28px;max-width:520px}
.sub strong{color:var(--text2)}
.ctas{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:100px;font:700 16px 'Inter',sans-serif;padding:16px 30px;cursor:pointer;background:var(--cyan);color:#000;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 44px -14px rgba(0,194,255,.8);transition:transform .2s,box-shadow .2s}
.btn::after{content:'';position:absolute;top:0;left:0;width:35%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-200%) skewX(-18deg);animation:shine 4.5s ease-in-out 1.2s infinite}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 18px 50px -12px rgba(0,194,255,.9)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}.btn:disabled::after{display:none}
.btn svg{flex-shrink:0}
.link{font:600 14px 'Inter',sans-serif;background:none;border:0;color:var(--text2);cursor:pointer;padding:8px 0;text-decoration:underline;text-decoration-color:rgba(255,255,255,.3);text-underline-offset:4px}
.link:hover{color:#fff}
button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
#ssc-nousb{background:rgba(255,92,92,.08);border:1px solid rgba(255,92,92,.3);color:#ffb4b4;padding:12px 16px;border-radius:12px;margin:0 0 18px;font-size:14px;max-width:520px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text3);border:1px solid var(--border);border-radius:100px;padding:6px 12px}
.chip svg{color:var(--ok)}
/* console (from the Shield page) */
.console{--ic-card:#11161d;--ic-line:rgba(255,255,255,.09);--ic-mist:#171d27;--ic-mute:#8b94a3;--acc:#00c2ff;--acc-rgb:0,194,255;background:var(--ic-card);border:1px solid rgba(var(--acc-rgb),.26);border-radius:22px;box-shadow:0 0 50px rgba(var(--acc-rgb),.1),0 24px 60px rgba(0,0,0,.55);overflow:hidden;transition:border-color .5s,box-shadow .5s}
.console[data-state=ok]{--acc:#16b87f;--acc-rgb:22,184,127}
.console[data-state=bad]{--acc:#ff5c5c;--acc-rgb:255,92,92}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;padding:15px 20px;border-bottom:1px solid var(--ic-line);background:var(--ic-mist)}
.c-top .t{font:600 13.5px 'Space Grotesk',system-ui,sans-serif;display:flex;align-items:center;gap:8px}
.ver{font:9px 'Space Mono',monospace;letter-spacing:.06em;color:var(--cyan);background:rgba(0,194,255,.1);border:1px solid rgba(0,194,255,.22);border-radius:5px;padding:2px 6px}
.c-status{display:inline-flex;align-items:center;gap:7px;font:700 9px 'Inter',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.c-steps{display:flex;border-bottom:1px solid var(--ic-line);background:#0d1218}
.c-step{flex:1;position:relative;font:10px 'Space Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ic-mute);padding:11px 6px 12px;text-align:center;transition:color .25s}
.c-step b{color:rgba(255,255,255,.28);margin-right:5px;font-weight:400}
.c-step::after{content:'';position:absolute;left:0;bottom:-1px;height:2px;width:100%;transform:scaleX(0);transform-origin:left;background:var(--acc);box-shadow:0 0 12px rgba(var(--acc-rgb),.7);transition:transform .6s}
.c-step.on{color:#fff;background:linear-gradient(180deg,transparent,rgba(var(--acc-rgb),.07))}.c-step.on b{color:var(--acc)}
.c-step.done{color:#fff}.c-step.done::after,.c-step.on::after{transform:scaleX(1)}
.c-step.on::after{animation:prog 2.2s linear infinite}
.c-scan{position:relative;height:236px;background:linear-gradient(180deg,#0a0f16,#121925);display:flex;align-items:center;justify-content:space-between;padding:0 20px;overflow:hidden}
.c-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(var(--acc-rgb),.1) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--acc-rgb),.1) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(ellipse 95% 85% at 50% 50%,#000 35%,transparent 100%);mask-image:radial-gradient(ellipse 95% 85% at 50% 50%,#000 35%,transparent 100%)}
.hud{position:absolute;width:14px;height:14px;border:2px solid rgba(var(--acc-rgb),.5);z-index:4}
.hud.tl{top:10px;left:10px;border-right:0;border-bottom:0}.hud.tr{top:10px;right:10px;border-left:0;border-bottom:0}.hud.bl{bottom:10px;left:10px;border-right:0;border-top:0}.hud.br{bottom:10px;right:10px;border-left:0;border-top:0}
.c-list{position:relative;z-index:3;display:flex;flex-direction:column;gap:6px;font:700 10px 'Space Mono',monospace;letter-spacing:.06em;text-transform:uppercase;min-width:0}
.c-list.right{align-items:flex-end;text-align:right}
.lh{color:rgba(var(--acc-rgb),.75);font-size:9px;letter-spacing:.12em;margin-bottom:2px;font-weight:400}
.cur{display:inline-block;margin-left:4px;color:var(--acc);animation:blink 1.1s steps(1) infinite}
.chk{color:rgba(255,255,255,.42);animation:scanpulse 4.2s linear infinite}
.chk:nth-of-type(3){animation-delay:.8s}.chk:nth-of-type(4){animation-delay:1.6s}.chk:nth-of-type(5){animation-delay:2.4s}
.num{color:#fff}.num i{font-style:normal;color:var(--ic-mute);font-weight:400}
.phone{position:relative;width:80px;height:160px;border:2px solid rgba(var(--acc-rgb),.6);border-radius:14px;background:rgba(var(--acc-rgb),.04);z-index:2;box-shadow:0 0 30px rgba(var(--acc-rgb),.22),inset 0 0 18px rgba(var(--acc-rgb),.06);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:border-color .5s,box-shadow .5s}
.phone::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:rgba(var(--acc-rgb),.55)}
.phone::after{content:'';position:absolute;inset:18px 6px 8px;border-radius:8px;background:linear-gradient(160deg,rgba(var(--acc-rgb),.15),rgba(var(--acc-rgb),.02) 55%);border:1px solid rgba(var(--acc-rgb),.15)}
.grade{position:relative;z-index:1;margin-top:10px;font:900 36px/1 'Bricolage Grotesque',sans-serif;color:var(--acc);text-shadow:0 0 18px rgba(var(--acc-rgb),.6);text-align:center;animation:gradein .6s cubic-bezier(.34,1.56,.64,1) both}
.grade small{display:block;font:700 7px 'Space Mono',monospace;letter-spacing:.14em;color:rgba(255,255,255,.55);margin-top:5px;white-space:nowrap}
.scanline{position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);box-shadow:0 0 14px var(--acc);z-index:3;animation:sweep 3s ease-in-out infinite}
.console[data-state=ok] .scanline,.console[data-state=bad] .scanline,.console[data-state=idle] .scanline{animation:none;opacity:0}
.c-spec{padding:4px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 20px;border-bottom:1px solid var(--ic-line);font-size:13px}
.row:last-child{border-bottom:0}
.row .k{font:10.5px 'Space Mono',monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ic-mute);flex-shrink:0}
.row .v{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.row .v.hl{color:var(--acc);transition:color .5s}
.ck{color:var(--ok)}
.c-foot{padding:12px 20px;border-top:1px solid var(--ic-line);font:12px 'Space Mono',monospace;color:var(--ic-mute);min-height:44px;background:#0d1218}
/* result details */
.result{margin:10px 0 0;display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:start}
.panel{background:var(--card);border:1px solid var(--border2);border-radius:22px;padding:26px 24px;position:relative;overflow:hidden}
.panel.bad{border-color:rgba(255,92,92,.35);box-shadow:0 0 50px rgba(255,92,92,.08)}
.panel.ok{border-color:rgba(22,184,127,.35);box-shadow:0 0 50px rgba(22,184,127,.08)}
.panel h2{font:900 30px/1.08 'Bricolage Grotesque',sans-serif;letter-spacing:-1px;margin:0 0 8px}
.panel.bad h2{color:var(--red)}.panel.ok h2{color:var(--ok)}
.panel p{margin:0 0 16px;color:var(--text2)}
.hits{list-style:none;margin:0;padding:0}
.hits li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 0;border-top:1px solid var(--border)}
.hits strong{font:700 19px 'Bricolage Grotesque',sans-serif}
.tag{align-self:center;background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.3);color:var(--red);border-radius:100px;padding:3px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.hits code{grid-column:1/-1;font:13px 'Space Mono',monospace;color:var(--text3);overflow-wrap:anywhere}
.next{list-style:none;margin:0 0 20px;padding:0;counter-reset:n}
.next li{counter-increment:n;position:relative;padding:0 0 14px 42px;color:var(--text2)}
.next li::before{content:counter(n,decimal-leading-zero);position:absolute;left:0;top:1px;font:700 12px 'Space Mono',monospace;color:var(--cyan);border:1px solid rgba(0,194,255,.35);border-radius:8px;padding:3px 6px}
.panel h3{font:700 13px 'Space Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);margin:0 0 14px}
.cta2{display:inline-flex;align-items:center;gap:8px;background:var(--cyan);color:#000;font-weight:700;font-size:14px;padding:12px 22px;border-radius:100px;text-decoration:none;margin-right:14px}
/* sections */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:56px 0 0}
.box{background:var(--card);border:1px solid var(--border2);border-radius:22px;padding:26px 24px}
.box.warn{background:linear-gradient(180deg,rgba(251,191,36,.07),rgba(251,191,36,.02));border-color:rgba(251,191,36,.28)}
.eye{font:12px 'Space Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);margin:0 0 8px}
.box.warn .eye{color:var(--gold)}
.box h2{font:700 24px/1.15 'Bricolage Grotesque',sans-serif;letter-spacing:-.5px;margin:0 0 14px}
.box ul{margin:0;padding:0;list-style:none}
.box ul li{position:relative;padding:0 0 12px 26px;color:var(--text2)}
.box ul li::before{content:'';position:absolute;left:4px;top:9px;width:8px;height:8px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--border);color:var(--text2)}
.steps li:first-child{border-top:0;padding-top:0}
.steps li::before{content:counter(s,decimal-leading-zero);font:700 13px 'Space Mono',monospace;color:var(--cyan);border:1px solid rgba(0,194,255,.35);border-radius:10px;height:32px;display:grid;place-items:center;background:rgba(0,194,255,.06)}
.db{margin:22px 0 0;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border2);border-radius:22px;overflow:hidden;background:var(--card)}
.db div{padding:20px 22px;border-left:1px solid var(--border)}
.db div:first-child{border-left:0}
.db b{display:block;font:900 32px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-1px}
.db span{font:10.5px 'Space Mono',monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
footer{margin:56px 0 0;padding:24px 0 48px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;color:var(--text3);font-size:13px}
footer a{color:var(--text2)}
@keyframes dotpulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(2.7);opacity:0}}
@keyframes shine{0%,70%{transform:translateX(-200%) skewX(-18deg)}100%{transform:translateX(400%) skewX(-18deg)}}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{50%{opacity:0}}
@keyframes scanpulse{0%,100%{color:rgba(255,255,255,.42);text-shadow:none}9%,17%{color:var(--acc);text-shadow:0 0 10px rgba(var(--acc-rgb),.55)}}
@keyframes gradein{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes sweep{0%{transform:translateY(16px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(220px);opacity:0}}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:34px;padding-top:20px}.result,.cols{grid-template-columns:1fr}.db{grid-template-columns:1fr 1fr}.db div:nth-child(3){border-left:0}.db div:nth-child(n+3){border-top:1px solid var(--border)}}
@media (max-width:480px){.c-scan{height:190px;padding:0 12px}.phone{width:62px;height:126px}.grade{font-size:28px}.c-list{font-size:8.5px}.row{padding:10px 14px;font-size:12.5px}.c-top,.c-foot{padding-left:14px;padding-right:14px}.c-step{font-size:9px}.btn{width:100%}h1{letter-spacing:-1.5px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="ssc-root">
  <div class="bar">
    <a class="brand" href="https://i-repair.it/irepair-shield/"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00c2ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l8 4v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-4z"/><path d="M9 12l2 2 4-4"/></svg><span>iRepair <b>Shield</b> Check<small>Rimini · Apple IRP</small></span></a>
    <span class="lang"><button type="button" data-lang="it">IT</button><button type="button" data-lang="en">EN</button></span>
  </div>

  <section class="hero">
    <div>
      <div class="badges">
        <span class="pill cyan"><span class="pulse"></span><span data-t="bFree"></span></span>
        <span class="pill green" data-t="bRead"></span>
        <span class="pill" data-t="bLocal"></span>
      </div>
      <h1><span class="eyebrow" data-t="eyebrow"></span><span class="w1" data-t="title"></span><span class="w2" data-t="titleAccent"></span></h1>
      <p class="lead" data-t="lead"></p>
      <p class="sub" data-t="sub" data-html></p>
      <p id="ssc-nousb" hidden data-t="noUsb"></p>
      <div class="ctas">
        <button class="btn" id="ssc-start" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v6M9 5h6M7 8h10v5a5 5 0 0 1-10 0z"/><path d="M12 18v4"/></svg><span data-t="start"></span></button>
        <button class="link" id="ssc-demo" type="button" data-t="demo"></button>
      </div>
      <div class="chips">
        <span class="chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13l3 3 5-8"/><circle cx="12" cy="12" r="9"/></svg><span data-t="c1"></span></span>
        <span class="chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span data-t="c2"></span></span>
        <span class="chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-4z"/></svg><span data-t="c3"></span></span>
      </div>
    </div>

    <div class="console" id="ssc-console" data-state="idle" aria-live="polite">
      <div class="c-top">
        <div class="t"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#00c2ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l8 4v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-4z"/><path d="M9 12l2 2 4-4"/></svg>Shield Check <span class="ver" id="ssc-dbVer">DB ···</span></div>
        <div class="c-status"><span class="pulse"></span><span data-t="live"></span></div>
      </div>
      <div class="c-steps">
        <div class="c-step on" id="ssc-st1"><b>01</b><span data-t="s1"></span></div>
        <div class="c-step" id="ssc-st2"><b>02</b><span data-t="s2"></span></div>
        <div class="c-step" id="ssc-st3"><b>03</b><span data-t="s3"></span></div>
      </div>
      <div class="c-scan">
        <div class="c-grid"></div>
        <span class="hud tl"></span><span class="hud tr"></span><span class="hud bl"></span><span class="hud br"></span>
        <div class="c-list">
          <span class="lh">// <span data-t="lChecks"></span><span class="cur">▊</span></span>
          <span class="chk" data-t="k1"></span>
          <span class="chk" data-t="k2"></span>
          <span class="chk" data-t="k3"></span>
          <span class="chk" data-t="k4"></span>
        </div>
